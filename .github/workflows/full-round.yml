name: Retain full check context
on:
  workflow_dispatch:
    inputs:
      context:
        description: Exact local context JSON from the worktree that started the change
        type: string
        required: true
permissions:
  contents: read
jobs:
  context:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the dispatched workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Preserve the submitted original
        id: original
        env:
          FULL_CONTEXT: ${{ inputs.context }}
        run: python3 -B .chrono-harness/ci/archive-context.py
      - name: Retain this round for one day
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ steps.original.outputs.name }}
          path: context.json
          retention-days: 1
          if-no-files-found: error
