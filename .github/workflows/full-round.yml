# chrono-ci: owned github-full-ci/v1
# chrono-ci: full source ".chrono-harness/ci/full.json"
name: "Native fixed context on macOS"
on:
  workflow_dispatch:
    inputs:
      context:
        description: Exact full context JSON; provision its referenced evidence through the registered bootstrap
        required: true
        type: string
permissions:
  contents: read
jobs:
  check:
    runs-on: "macos-26"
    timeout-minutes: 15
    steps:
      - name: Check out supplied candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ fromJSON(inputs.context).candidate }}
          fetch-depth: 0
          persist-credentials: true
      - name: Bootstrap registered tools and evidence
        shell: bash
        run: |
          '/usr/bin/python3' '-B' '.chrono-harness/ci/qualification-bootstrap.py'
      - name: Canonical full harness check
        shell: bash
        env:
          CHRONO_CHECK_SOURCE: ci
          CHRONO_WORKFLOW_REVISION: ${{ github.workflow_sha }}
        run: |
          '.chrono-harness/bin/chrono-harness' 'check'
      - name: Preserve original full check evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: chrono-full-check-${{ github.run_id }}-${{ github.run_attempt }}
          path: ".chrono-harness/state/native-ok/"
          if-no-files-found: error
          include-hidden-files: true
