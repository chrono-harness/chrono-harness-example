name: Portable full developer check
on:
  push:
    branches: [probe/portable-full-548-rejection]
permissions:
  contents: read
jobs:
  full:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, ubuntu-24.04]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          path: acceptance
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 440c8776191f2084c1582625c1cdb920c8fafc60
          fetch-depth: 0
          persist-credentials: false
          path: example
      - name: Install the selected release binaries outside the checkout
        working-directory: example
        run: sh .chrono-harness/ci/install.sh
      - name: Run the captured development and delivery checks
        run: /usr/bin/python3 acceptance/.github/full-native.py example "$RUNNER_TEMP" 949398f8899ccf12162bb151b3213c0121d207a1

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: example-full-548-origins-${{ matrix.runner }}
          path: ${{ runner.temp }}/example-*.json
          retention-days: 1
          if-no-files-found: error
