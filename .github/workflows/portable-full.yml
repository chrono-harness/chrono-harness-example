name: Portable full developer check
on:
  push:
    branches: [probe/portable-full-developer]
permissions:
  contents: read
jobs:
  full:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, ubuntu-24.04]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          path: acceptance
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: a3f571a6f54af24a7d464eea1f6570cde46b3103
          fetch-depth: 0
          persist-credentials: false
          path: example
      - name: Install the selected release binaries outside the checkout
        working-directory: example
        run: sh .chrono-harness/ci/install.sh
      - name: Run the captured development and delivery checks
        run: /usr/bin/python3 acceptance/.github/full-native.py example "$RUNNER_TEMP" d5684ffa78965e1234f3ce7c3a0d981d7b546802
