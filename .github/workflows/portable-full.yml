name: Portable full developer check
on:
  push:
    branches: [probe/66-cost-exit-stable]
permissions:
  contents: read
jobs:
  full:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, ubuntu-24.04]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          path: acceptance
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 615acdfc30c1a5bcd78df064e983fbc8cab0eeb6
          fetch-depth: 0
          persist-credentials: false
          path: example
      - name: Install the selected release binaries outside the checkout
        working-directory: example
        run: sh .chrono-harness/ci/install.sh
      - name: Run the captured development and delivery checks
        run: /usr/bin/python3 acceptance/.github/full-native.py example "$RUNNER_TEMP" d5684ffa78965e1234f3ce7c3a0d981d7b546802
      - name: Read the original cost report and check the CLI error status
        run: |
          python3 acceptance/.github/verify-host.py "$RUNNER_TEMP"
          python3 acceptance/.github/closed-pipe.py example/.chrono-harness/bin/chrono-judge-cost
