name: Template adoption
on:
  pull_request:
    branches: [dev]
    paths:
      - .github/verify-template.py
      - .github/workflows/template-adoption.yml
      - .chrono-harness/template-answers.yml
      - .github/roadmap.cjs
      - .github/workflows/issue-roadmap.yml
  push:
    branches: [dev]
permissions:
  contents: read
jobs:
  copier:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install the pinned Copier tool
        run: |
          python3 -m venv "$RUNNER_TEMP/copier"
          "$RUNNER_TEMP/copier/bin/pip" install copier==9.19.1
      - name: Render the installed template and verify the selected host files
        run: '"$RUNNER_TEMP/copier/bin/python" .github/verify-template.py'
