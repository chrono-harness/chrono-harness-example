# The checkout supplies the tool names and download locations. Installed data contains versions and SHA-256 only.
[vars]
chrono_selection = '{{ config_root }}/.chrono-harness/state/tool-selection/versions.toml'
chrono_pins = '{{ config_root }}/.config/mise/conf.d/chrono-harness.toml'
selected_chrono_harness = "{% if vars.chrono_selection is exists %}{% set data = read_toml(path=vars.chrono_selection) %}{% endif %}{% if data is defined and \"chrono-harness\" in data %}{% set version = data[\"chrono-harness\"][0] %}{% if version is matching(pat=\"^[0-9]+[.][0-9]+[.][0-9]+(-[A-Za-z0-9-]+([.][A-Za-z0-9-]+)*)?$\") %}{{ version }}{% else %}{{ throw(message=\"Invalid installed release version\") }}{% endif %}{% endif %}"


[tools."http:chrono-harness"]
version = "{% if vars.selected_chrono_harness %}{{ vars.selected_chrono_harness }}{% else %}{{ read_toml(path=vars.chrono_pins)[\"tools\"][\"http:chrono-harness\"][\"version\"] }}{% endif %}"
bin = "chrono-harness"
[tools."http:chrono-harness".platforms]
linux-x64 = { url = "{% if vars.selected_chrono_harness %}https://github.com/chrono-harness/chrono-harness-runner/releases/download/v{{ vars.selected_chrono_harness }}/chrono-harness-linux-x86_64{% else %}{{ read_toml(path=vars.chrono_pins)[\"tools\"][\"http:chrono-harness\"][\"platforms\"][\"linux-x64\"][\"url\"] }}{% endif %}", checksum = "{% if vars.selected_chrono_harness %}{% set hash = read_toml(path=vars.chrono_selection)[\"chrono-harness\"][1] %}{% if hash is matching(pat=\"^sha256:[a-f0-9]{64}$\") %}{{ hash }}{% else %}{{ throw(message=\"Invalid installed release checksum\") }}{% endif %}{% else %}{{ read_toml(path=vars.chrono_pins)[\"tools\"][\"http:chrono-harness\"][\"platforms\"][\"linux-x64\"][\"checksum\"] }}{% endif %}" }
macos-arm64 = { url = "{% if vars.selected_chrono_harness %}https://github.com/chrono-harness/chrono-harness-runner/releases/download/v{{ vars.selected_chrono_harness }}/chrono-harness-macos-aarch64{% else %}{{ read_toml(path=vars.chrono_pins)[\"tools\"][\"http:chrono-harness\"][\"platforms\"][\"macos-arm64\"][\"url\"] }}{% endif %}", checksum = "{% if vars.selected_chrono_harness %}{% set hash = read_toml(path=vars.chrono_selection)[\"chrono-harness\"][2] %}{% if hash is matching(pat=\"^sha256:[a-f0-9]{64}$\") %}{{ hash }}{% else %}{{ throw(message=\"Invalid installed release checksum\") }}{% endif %}{% else %}{{ read_toml(path=vars.chrono_pins)[\"tools\"][\"http:chrono-harness\"][\"platforms\"][\"macos-arm64\"][\"checksum\"] }}{% endif %}" }
